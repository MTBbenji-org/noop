
name: NOOP TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      - name: Prepare Xcode project
        env:
          TEAMID: ${{ secrets.TEAMID }}
        run: |
          cat > Config/BundleIdSecrets.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${TEAMID}
          EOF

          xcodegen generate

      - name: Sign, build and upload
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          TEAMID: ${{ secrets.TEAMID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p fastlane

          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :testflight_noop do
              setup_ci

              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("FASTLANE_KEY_ID"),
                issuer_id: ENV.fetch("FASTLANE_ISSUER_ID"),
                key_content: ENV.fetch("FASTLANE_KEY")
              )

              match(
                type: "appstore",
                git_url: "https://github.com/MTBbenji-org/Match-Secrets.git",
                git_basic_authorization: Base64.strict_encode64(
                  "x-access-token:#{ENV.fetch('GH_PAT')}"
                ),
                api_key: api_key,
                app_identifier: [
                  "com.mtbbenji.noop",
                  "com.mtbbenji.noop.widgets"
                ],
                readonly: true
              )

              profiles = {
                "com.mtbbenji.noop" =>
                  "match AppStore com.mtbbenji.noop",
                "com.mtbbenji.noop.widgets" =>
                  "match AppStore com.mtbbenji.noop.widgets"
              }

              project = File.expand_path("../Strand.xcodeproj", __dir__)

              require "xcodeproj"
              xcode_project = Xcodeproj::Project.open(project)

              {
                "NOOPiOS" => profiles.fetch("com.mtbbenji.noop"),
                "NOOPiOSWidgets" => profiles.fetch("com.mtbbenji.noop.widgets")
              }.each do |target_name, profile_name|
                target = xcode_project.targets.find do |item|
                  item.name == target_name
                end

                UI.user_error!("Target not found: #{target_name}") unless target

                target.build_configurations.each do |config|
                  next unless config.name == "Release"

                  config.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAMID")
                  config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                  config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                  config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = profile_name
                end
              end

              xcode_project.save

              build_app(
                project: project,
                scheme: "NOOPiOS",
                configuration: "Release",
                export_method: "app-store",
                output_directory: "build",
                output_name: "NOOP.ipa",
                destination: "generic/platform=iOS",
                xcargs: [
                  "DEVELOPMENT_TEAM=#{ENV.fetch('TEAMID')}",
                  "CURRENT_PROJECT_VERSION=#{ENV.fetch('BUILD_NUMBER')}"
                ].join(" "),
                export_options: {
                  method: "app-store",
                  signingStyle: "manual",
                  teamID: ENV.fetch("TEAMID"),
                  provisioningProfiles: profiles
                }
              )

              upload_to_testflight(
                api_key: api_key,
                ipa: "build/NOOP.ipa",
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY

          fastlane ios testflight_noop
